name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
        env:
          PUBLIC_INDEXING_ENABLED: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
      
      - name: Sync content store for testing
        run: mkdir -p .astro && cp node_modules/.astro/data-store.json .astro/data-store.json
      
      - name: Run tests
        run: npm run test

