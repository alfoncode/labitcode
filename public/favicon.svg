<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <clipPath id="flask-clip">
      <path d="M216 88 L216 190 L108 400 Q100 416 116 432 L396 432 Q412 416 404 400 L296 190 L296 88 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Flask outline — white -->
  <path d="M216 88 L216 190 L108 400 Q100 416 116 432 L396 432 Q412 416 404 400 L296 190 L296 88"
        stroke="#F1F5F9" stroke-width="22" stroke-linejoin="round" stroke-linecap="round" fill="none"/>

  <!-- Flask top rim — white -->
  <line x1="194" y1="88" x2="318" y2="88" stroke="#F1F5F9" stroke-width="22" stroke-linecap="round"/>

  <!-- Red liquid inside flask (clipped) -->
  <g clip-path="url(#flask-clip)">
    <rect x="100" y="320" width="312" height="120" fill="url(#red)" opacity="0.25"/>
    <!-- Liquid surface wave -->
    <path d="M100 320 Q180 305 256 320 Q332 335 412 320 L412 440 L100 440 Z" fill="url(#red)" opacity="0.15"/>
  </g>

  <!-- Code brackets inside flask — red -->
  <!-- < bracket -->
  <path d="M220 310 L185 350 L220 390" stroke="url(#red)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- > bracket -->
  <path d="M292 310 L327 350 L292 390" stroke="url(#red)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- / slash -->
  <line x1="244" y1="385" x2="268" y2="315" stroke="#EF4444" stroke-width="18" stroke-linecap="round"/>

  <!-- Bubbles rising from liquid — red -->
  <circle cx="235" cy="265" r="9" fill="#EF4444" opacity="0.5"/>
  <circle cx="275" cy="238" r="6" fill="#EF4444" opacity="0.4"/>
  <circle cx="255" cy="212" r="4" fill="#EF4444" opacity="0.3"/>

</svg>
